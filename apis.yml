aid: duolingo
name: Duolingo
description: 'Duolingo (NASDAQ: DUOL) is a Pittsburgh, Pennsylvania based learning
  technology company best known for the Duolingo language-learning app, the world''s
  most-downloaded education app, offering courses in more than 40 languages including
  Spanish, English, French, German, Italian, Portuguese, Japanese, and Chinese. Founded
  in 2011 by Luis von Ahn and Severin Hacker, Duolingo has expanded its consumer learning
  footprint beyond languages with Duolingo Math, Duolingo Music, a newly rolled-out
  Chess course, and Duolingo ABC for early literacy, all delivered through the same
  gamified, streak- driven mobile experience. The Company also operates the Duolingo
  English Test, a digital English-proficiency exam accepted by thousands of higher-
  education institutions, certification programs, and government agencies worldwide
  as an alternative to TOEFL and IELTS. Duolingo monetizes through Super Duolingo
  and Duolingo Max subscriptions, in-app advertising, in-app purchases, and Duolingo
  English Test fees. The company surpassed 50 million daily active users in Q3 2025
  and reported 41% revenue growth in Q2 2025. Duolingo does not publish an official
  public developer API, SDK, or developer portal; integrations with the Duolingo English
  Test (score-send to institutional CRMs such as Slate) are handled through a private
  API-key program negotiated directly with accepting institutions. Community- maintained
  reverse-engineered clients exist against the unofficial https://www.duolingo.com/api/1
  surface but are not endorsed by Duolingo.'
